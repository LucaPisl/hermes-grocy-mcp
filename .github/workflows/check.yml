name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_contract:
        description: Run the disposable Grocy contract
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GROCY_TEST_STATE: ${{ runner.temp }}/grocy-mcp-contract
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libglib2.0-dev pkg-config dbus-daemon openssl
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: python3 scripts/docker_fixture.py start --state "$GROCY_TEST_STATE"
      - if: github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: python3 scripts/docker_fixture.py test --state "$GROCY_TEST_STATE"
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: |
          if [ -f "$GROCY_TEST_STATE/fixture.json" ]; then
            python3 scripts/docker_fixture.py stop --state "$GROCY_TEST_STATE"
          fi
