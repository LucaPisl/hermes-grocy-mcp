name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_contract:
        description: Run the disposable Grocy contract
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libglib2.0-dev pkg-config dbus-daemon openssl
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: python3 scripts/docker_fixture.py start --state "${RUNNER_TEMP}/grocy-mcp-contract"
      - if: github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: python3 scripts/docker_fixture.py test --state "${RUNNER_TEMP}/grocy-mcp-contract"
      - if: always() && github.event_name == 'workflow_dispatch' && inputs.docker_contract
        run: |
          if [ -f "${RUNNER_TEMP}/grocy-mcp-contract/fixture.json" ]; then
            python3 scripts/docker_fixture.py stop --state "${RUNNER_TEMP}/grocy-mcp-contract"
          fi
